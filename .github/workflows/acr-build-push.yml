name: CI/CD - Build and Push Docker image to ACR

on:
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - "main.py"
      - ".github/workflows/acr-build-push.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Select ACR subscription
        run: az account set --subscription "${{ secrets.ACR_SUBSCRIPTION_ID }}"

      - name: Login to ACR with Azure CLI
        run: az acr login --name "${{ vars.ACR_NAME }}" --resource-group "${{ vars.ACR_RESOURCE_GROUP }}"

      - name: Compute ACR login server
        id: acr_server
        run: |
          LOGIN_SERVER="${{ vars.ACR_LOGIN_SERVER }}"
          if [ -z "$LOGIN_SERVER" ]; then
            LOGIN_SERVER=$(az acr show \
              --name "${{ vars.ACR_NAME }}" \
              --resource-group "${{ vars.ACR_RESOURCE_GROUP }}" \
              --query loginServer -o tsv)
          fi

          if [ -z "$LOGIN_SERVER" ]; then
            echo "::error::ACR login server is empty. Define variable ACR_LOGIN_SERVER or grant Reader on ACR."
            exit 1
          fi

          echo "login_server=$LOGIN_SERVER" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.acr_server.outputs.login_server }}/${{ vars.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
